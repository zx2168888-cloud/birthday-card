<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f5efe7;
    color: #3a3430;
}

.card {
    width: min(90%, 390px);
    min-height: 620px;
    padding: 50px 30px;
    border-radius: 30px;
    background: #fffaf5;
    box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    text-align: center;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.small {
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

h1 {
    font-size: 42px;
    line-height: 1.1;
    letter-spacing: 3px;
    margin: 0;
}

.name {
    margin-top: 30px;
    font-size: 24px;
}

.date {
    margin-top: 15px;
    font-size: 14px;
    color: #8d7770;
}

button {
    margin-top: 60px;
    padding: 16px 28px;
    border: none;
    border-radius: 50px;
    background: #a87979;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.message {
    display: none;
    margin-top: 35px;
    line-height: 2;
    font-size: 16px;
}

.heart {
    font-size: 45px;
    margin-bottom: 25px;
}
</style>
</head>

<body>

<div class="card">

    <div class="small">A SPECIAL DAY</div>

    <div class="heart">♡</div>

    <h1>
        HAPPY<br>
        BIRTHDAY
    </h1>

    <div class="曹芝敏">
        XXX
    </div>

    <div class="2026.10.30">
        2026.XX.XX
    </div>

    <button onclick="openGift()">
        打開禮物 🎁
    </button>

    <div class="message" id="message">

        <p>
        生日快樂。
        </p>

        <p>
        希望新的一歲，<br>
        妳可以遇到很多很多<br>
        值得開心的事情。
        </p>

        <p>
        也希望我可以繼續<br>
        陪妳走過下一個生日。
        </p>

        <p>
        — Calvin ♡
        </p>

    </div>

</div>

<script>

function openGift() {

    document.querySelector("button").style.display = "none";

    document.getElementById("message").style.display = "block";

}

</script>

</body>
</html>
